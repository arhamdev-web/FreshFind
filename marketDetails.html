<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshFind — Market Details</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;0,900;1,500&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
    </style>
</head>
<body>

    <!-- Navbar (injected by main.js) -->
    <div id="navbarPlaceholder"></div>

    <!-- Not Found State -->

    <section class="marketNotFoundSection" id="marketNotFoundSection">
        <i class="fa-solid fa-store-slash"></i>
        <h2>Market Not Found</h2>
        <p>We couldn't find the market you're looking for.</p>
        <a href="marketDirectory.html" class="marketNotFoundButton">Back to Market Directory</a>
    </section>

    <!-- Market Details Content -->

    <div id="marketDetailsContent">

        <section class="marketDetailsBanner" id="marketDetailsBanner">
            <div class="marketDetailsBannerOverlay"></div>
            <div class="marketDetailsBannerContent">
                <a href="marketDirectory.html" class="marketDetailsBackLink"><i class="fa-solid fa-arrow-left"></i> Back to Directory</a>
                <h1 id="marketDetailsName"></h1>
                <p id="marketDetailsLocationLine"></p>
            </div>
        </section>

        <section class="marketDetailsSection">
            <div class="marketDetailsGrid">
                <div class="marketDetailsMain">
                    <div class="marketDetailsBlock">
                        <h2>About This Market</h2>
                        <p id="marketDetailsDescription"></p>
                    </div>

                    <div class="marketDetailsBlock">
                        <h2>Produce Available</h2>
                        <div class="marketDetailsProduceGrid" id="marketDetailsProduceGrid"></div>
                    </div>

                    <div class="marketDetailsBlock">
                        <h2>Weekly Schedule</h2>
                        <div class="marketDetailsScheduleTable" id="marketDetailsScheduleTable"></div>
                    </div>
                </div>

                <div class="marketDetailsSidebar">
                    <div class="marketDetailsBlock">
                        <h2>Location</h2>
                        <p class="marketDetailsAddress" id="marketDetailsAddress"></p>
                        <div id="marketDetailsMap" class="marketDetailsMap"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer (injected by main.js) -->
    <div id="footerPlaceholder"></div>

    <!-- Chatbot Widget (injected by chatbot.js) -->
    <div id="chatbotPlaceholder"></div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/marketDetails.js"></script>
</body>
</html>
