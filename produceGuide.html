<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshFind — Produce Guide</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;0,900;1,500&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
    </style>
</head>
<body>

    <!-- Navbar (injected by main.js) -->
    <div id="navbarPlaceholder"></div>

    <!-- Produce Guide Hero -->

    <section class="pageHeroSection">
        <div class="pageHeroContent">
            <h1>Produce Guide</h1>
            <p>What's out there, how it's grown, and how it reaches the market.</p>
        </div>
    </section>

    <!-- Filters -->

    <section class="produceFiltersSection">
        <form class="produceFilters" id="produceFiltersForm">
            <input type="text" class="produceSearchInput" id="produceSearchInput" placeholder="Search produce by name...">

            <select class="produceSelect" id="produceCategorySelect">
                <option value="">All Categories</option>
            </select>

            <div class="produceFilterButtons">
                <button type="submit" class="produceSearchButton">Search</button>
                <button type="button" class="produceResetButton" id="produceResetButton">Reset</button>
            </div>
        </form>
    </section>

    <!-- Results -->

    <section class="produceResultsSection">
        <div class="produceResultsGrid" id="produceResultsContainer"></div>

        <div class="produceEmptyState" id="produceEmptyState">
            <i class="fa-solid fa-magnifying-glass"></i>
            <h3>No produce found</h3>
            <p>Try a different search term or category.</p>
        </div>
    </section>

    <!-- Expand Modal -->

    <div class="produceExpandOverlay" id="produceExpandOverlay">
        <div class="produceExpandModal">
            <button type="button" class="marketExpandCloseButton" id="produceExpandCloseButton" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="produceExpandImage" id="produceExpandImage"></div>
            <div class="produceExpandBody" id="produceExpandBody"></div>
        </div>
    </div>

    <!-- Footer (injected by main.js) -->
    <div id="footerPlaceholder"></div>

    <!-- Chatbot Widget (injected by chatbot.js) -->
    <div id="chatbotPlaceholder"></div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/produceGuide.js"></script>
</body>
</html>
