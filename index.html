<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshFind</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;0,900;1,500&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
    </style>
</head>
<body>

    <!-- Landing Section -->

    <section class="landingSection">
        <div class="landingOverlay"></div>
        <div class="landingContent landingFadeIn">
            <div class="landingBrand">
                <img src="assets/logo/freshfindLogo.webp" alt="FreshFind Logo" class="landingBrandLogo">
                <span>FreshFind</span>
            </div>
            <h1 class="landingHeading">Fresh, Local, Nearby.</h1>
            <p class="landingTagline">
                Discover the farmers markets closest to you, and know
                exactly what's in season before you go.
            </p>
            <button type="button" class="landingExploreButton" id="exploreButton">
                Explore FreshFind
            </button>
        </div>
    </section>
    
<script src="js/main.js"></script>
</body>
</html>
