<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshFind — Contact</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;0,900;1,500&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
    </style>
</head>
<body>

    <!-- Navbar (injected by main.js) -->
    <div id="navbarPlaceholder"></div>

    <!-- Contact Hero -->

    <section class="pageHeroSection">
        <div class="pageHeroContent">
            <h1>Contact Us</h1>
            <p>Have a question or feedback? We'd love to hear from you.</p>
        </div>
    </section>

    <!-- Contact Content -->

    <section class="contactSection">
        <div class="contactGrid">

            <div class="contactFormCard">
                <h2>Send Us a Message</h2>
                <form class="contactForm" id="contactForm">
                    <div class="authFormGrid">
                        <div class="authFormGroup">
                            <label for="contactName">Full Name</label>
                            <input type="text" id="contactName" placeholder="Enter your full name">
                            <p class="authError" id="contactNameError"></p>
                        </div>
                        <div class="authFormGroup">
                            <label for="contactEmail">Email</label>
                            <input type="text" id="contactEmail" placeholder="Enter your email">
                            <p class="authError" id="contactEmailError"></p>
                        </div>
                        <div class="authFormGroup">
                            <label for="contactPhone">Phone Number</label>
                            <input type="tel" id="contactPhone" placeholder="Enter your phone number">
                            <p class="authError" id="contactPhoneError"></p>
                        </div>
                        <div class="authFormGroup">
                            <label for="contactCity">City</label>
                            <input type="text" id="contactCity" placeholder="Enter your city">
                            <p class="authError" id="contactCityError"></p>
                        </div>
                    </div>

                    <div class="contactFormGroup">
                        <label>Products You're Interested In (optional)</label>
                        <div class="contactCheckboxGroup">
                            <label class="contactCheckboxLabel"><input type="checkbox" value="Vegetables"> Vegetables</label>
                            <label class="contactCheckboxLabel"><input type="checkbox" value="Fruits"> Fruits</label>
                            <label class="contactCheckboxLabel"><input type="checkbox" value="Dairy"> Dairy</label>
                            <label class="contactCheckboxLabel"><input type="checkbox" value="Herbs"> Herbs</label>
                            <label class="contactCheckboxLabel"><input type="checkbox" value="Grains"> Grains</label>
                            <label class="contactCheckboxLabel"><input type="checkbox" value="Other"> Other</label>
                        </div>
                    </div>

                    <div class="authFormGroup">
                        <label for="contactMessage">Message</label>
                        <textarea id="contactMessage" rows="5" placeholder="Tell us what's on your mind..."></textarea>
                        <p class="authError" id="contactMessageError"></p>
                    </div>

                    <button type="submit" class="authSubmitButton">Send Message</button>
                </form>
            </div>

            <div class="contactInfoCard">
                <h2>Other Ways to Reach Us</h2>

                <div class="contactInfoRow">
                    <i class="fa-solid fa-envelope"></i>
                    <div>
                        <h4>Email</h4>
                        <p>hello@freshfind.pk</p>
                    </div>
                </div>

                <div class="contactInfoRow">
                    <i class="fa-solid fa-phone"></i>
                    <div>
                        <h4>Phone</h4>
                        <p>+92 300 1234567</p>
                    </div>
                </div>

                <div class="contactInfoRow">
                    <i class="fa-solid fa-clock"></i>
                    <div>
                        <h4>Response Time</h4>
                        <p>We usually reply within 1–2 business days.</p>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Success Overlay -->

    <div class="contactSuccessOverlay" id="contactSuccessOverlay">
        <div class="contactSuccessCard">
            <i class="fa-solid fa-circle-check"></i>
            <h2>Message Sent!</h2>
            <p>Thanks for reaching out — we'll get back to you soon.</p>
            <button type="button" class="authSubmitButton" id="contactSuccessCloseButton">Send Another Message</button>
        </div>
    </div>

    <!-- Footer (injected by main.js) -->
    <div id="footerPlaceholder"></div>

    <!-- Chatbot Widget (injected by chatbot.js) -->
    <div id="chatbotPlaceholder"></div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/contact.js"></script>
</body>
</html>
